
name: Build C Programs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install GCC
        uses: egor-tensin/setup-mingw@v3
        with:
          platform: x64

      - name: Check GCC
        run: gcc --version
        shell: pwsh

      - name: Compile C Programs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output

          $files = Get-ChildItem -Path . -Filter *.c -File

          if ($files.Count -eq 0) {
            throw "No C files found in repository root."
          }

          foreach ($file in $files) {
            $name = $file.BaseName

            Copy-Item $file.FullName "output/$name.c"

            gcc $file.FullName -o "output/$name.exe"

            if ($LASTEXITCODE -ne 0) {
              throw "Compilation failed: $name"
            }

            Write-Host "Successfully compiled: $name"
          }

      - name: Upload Code and EXE Files
        uses: actions/upload-artifact@v4
        with:
          name: C-Code-and-EXE-Files
          path: output/*
